[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "siopy"
version = "0.1.0"
description = "Dados abertos do Orçamento Federal (SIOP) e emendas parlamentares (Portal da Transparência) em pandas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "André Leite", email = "leite@castlab.org" }]
keywords = ["orçamento", "SIOP", "emendas parlamentares", "dados abertos", "Brasil"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/castlab/siop-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/siopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
