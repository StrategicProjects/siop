[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "siopy-br"
version = "0.1.0"
description = "Brazilian federal budget (SIOP open data) and parliamentary amendments (Portal da Transparência) in pandas"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "André Leite", email = "leite@castlab.org" }]
keywords = [
  "orçamento",
  "SIOP",
  "emendas parlamentares",
  "Portal da Transparência",
  "dados abertos",
  "open-data",
  "Brazil",
  "pandas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "build>=1.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.urls]
Homepage = "https://strategicprojects.github.io/siop/"
Documentation = "https://strategicprojects.github.io/siop/siopy/"
Repository = "https://github.com/StrategicProjects/siop"
Issues = "https://github.com/StrategicProjects/siop/issues"
Changelog = "https://github.com/StrategicProjects/siop/blob/main/siopy/NEWS.md"

[tool.hatch.build.targets.wheel]
packages = ["src/siopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
