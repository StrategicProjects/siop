<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 200 231" width="200" height="231" version="1.1"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">siopy</title>
  <desc id="logo-desc">Hexagonal badge: a budget law document with one amended
  line highlighted in amber, flowing into three coins (empenhado, liquidado,
  pago), above the siopy wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="4.5" y1="0.3" x2="195.5" y2="203.7"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#0e3a53;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c7da0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#f7d154"/>
      <stop offset="100%" style="stop-color:#e8a200"/>
    </linearGradient>
  </defs>

  <!-- Hex badge -->
  <path d="m 100,2 94,50 V 152 L 100,202 6,152 V 52 Z"
        fill="url(#bg)" stroke="#082435" stroke-width="3"/>

  <!-- Blueprint grid -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.6">
    <line x1="20" y1="46"  x2="180" y2="46"/>
    <line x1="14" y1="72"  x2="186" y2="72"/>
    <line x1="14" y1="98"  x2="186" y2="98"/>
    <line x1="14" y1="124" x2="186" y2="124"/>
    <line x1="52" y1="28"  x2="52"  y2="144"/>
    <line x1="100" y1="6"  x2="100" y2="144"/>
    <line x1="148" y1="28" x2="148" y2="144"/>
  </g>

  <!-- Budget document (the LOA) -->
  <g>
    <rect x="52" y="30" width="78" height="100" rx="7"
          fill="#ffffff" opacity="0.96"/>
    <!-- folded corner -->
    <path d="M 112,30 h 11 a 7,7 0 0 1 7,7 v 11 z" fill="#c9d9e4"/>
    <!-- ordinary budget lines -->
    <g stroke="#9fb3c8" stroke-width="5" stroke-linecap="round">
      <line x1="62" y1="48"  x2="100" y2="48"/>
      <line x1="62" y1="64"  x2="118" y2="64"/>
      <line x1="62" y1="96"  x2="118" y2="96"/>
      <line x1="62" y1="112" x2="104" y2="112"/>
    </g>
    <!-- the amendment: an inserted line, wider than the sheet -->
    <rect x="44" y="73" width="100" height="14" rx="4"
          fill="url(#coin)" stroke="#082435" stroke-width="1.2"/>
    <g stroke="#0e3a53" stroke-width="3.4" stroke-linecap="round">
      <line x1="55" y1="80" x2="63" y2="80"/>
      <line x1="59" y1="76" x2="59" y2="84"/>
      <line x1="71" y1="80" x2="134" y2="80"/>
    </g>
  </g>

  <!-- Execution: three coins cascading from the amended line -->
  <path d="M 144,87 q 18,10 10,34" fill="none" stroke="#ffffff"
        stroke-width="2.4" stroke-dasharray="1 6" stroke-linecap="round"
        opacity="0.9"/>
  <g stroke="#082435" stroke-width="1.4">
    <circle cx="150" cy="128" r="9.5" fill="url(#coin)"/>
    <circle cx="131" cy="135" r="9.5" fill="url(#coin)"/>
    <circle cx="112" cy="142" r="9.5" fill="url(#coin)"/>
  </g>
  <g fill="#0e3a53" font-family="'Fira Code', 'Courier New', monospace"
     font-size="11px" font-weight="700" text-anchor="middle">
    <text x="150" y="132">E</text>
    <text x="131" y="139">L</text>
    <text x="112" y="146">P</text>
  </g>

  <!-- Package name -->
  <text x="100" y="170" text-anchor="middle"
        font-family="'Fira Code', 'Courier New', monospace"
        font-size="23px" font-weight="700" fill="#ffffff"
        letter-spacing="2">siopy</text>
</svg>
