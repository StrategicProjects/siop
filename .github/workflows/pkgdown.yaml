# Monta o site pkgdown do siopr e publica no branch gh-pages, servido em
# https://strategicprojects.github.io/siop/
name: pkgdown

on:
  push:
    branches: [main]
    paths:
      - "siopr/**"
      - ".github/workflows/pkgdown.yaml"
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: siopr
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        working-directory: siopr
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: siopr/docs
