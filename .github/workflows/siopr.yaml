# R CMD check do siopr em vários sistemas e versões de R. Os testes rodam
# offline (respostas mockadas); nada aqui chama as APIs reais.
name: siopr

on:
  push:
    paths:
      - "siopr/**"
      - ".github/workflows/siopr.yaml"
  pull_request:
    paths:
      - "siopr/**"
      - ".github/workflows/siopr.yaml"

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: "4.1"}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: siopr
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: siopr
          args: 'c("--no-manual", "--as-cran")'
          upload-snapshots: true
